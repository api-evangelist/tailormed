name: TailorMed standards conformance
description: >-
  Standards TailorMed's published integration surface asserts. TailorMed publishes no
  public OpenAPI, AsyncAPI, GraphQL SDL, WSDL or .proto, so nothing here is read out of
  a machine-readable contract. Cross-cutting OAuth/OIDC entries are read off live
  discovery documents; the healthcare domain-standard entries are read off TailorMed's
  own versioned documentation program, whose page titles, section structure and version
  footers are served publicly even though the body content requires a login.
note: >-
  The TailorMed Implementation Hub (hub.tailormed.co, canonical docs.tailormed.co) is
  labelled "TAILORMED CONFIDENTIAL AND PROPRIETARY" and gates its body content behind
  an Okta login. No gated content was read or reproduced. Only the public sitemap,
  public page titles and the publicly rendered version footer were used as evidence.
