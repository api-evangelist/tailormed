aid: tailormed
name: TailorMed
description: >-
  TailorMed is a medication success platform that removes access, affordability and
  adherence barriers across the patient medication journey. Its software connects
  patients, health systems, clinics, pharmacies and life sciences companies to
  financial assistance, copay, foundation and free-drug programs, and keeps patient,
  prescription and program data in sync with the record of care via HL7/FHIR, a REST
  API, or SFTP file exchange. The product line spans TailorMed Core, Connect,
  Complete, Amplify and Alliance. TailorMed runs a versioned integration program —
  an Application Data API, a Claims Data API, a webhook guide and an HL7/FHIR data
  exchange — documented on a customer-only Implementation Hub; no machine-readable
  contract is published publicly.
