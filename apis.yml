apis:
- name: TailorMed Application Data API
  description: >-
    REST API for exchanging patient, prescription, encounter and assistance-program
    application data between a health system, clinic or pharmacy and the TailorMed
    platform. Part of TailorMed's DTA (Data Transfer & API) program. Versioned v1.9
    through v1.9.4. The reference is published only on the customer-only TailorMed
    Implementation Hub, so no OpenAPI or base URL is publicly stated.
  humanURL: https://hub.tailormed.co/dta/applicationAPI/v1.9.4
  baseURL: null
  tags:
  - Medication Access
  - Patient Assistance
  - Health IT
  properties:
  - type: Documentation
    url: https://hub.tailormed.co/dta/api-documentation
  - type: ChangeLog
    url: changelog/tailormed-changelog.yml
  - type: Webhooks
    url: asyncapi/tailormed-webhooks.yml
- name: TailorMed Claims Data API
  description: >-
    REST API for submitting and reconciling claims data against TailorMed's
    affordability and assistance workflows. Versioned v1.1. Reference published only
    on the customer-only TailorMed Implementation Hub.
  humanURL: https://hub.tailormed.co/dta/claims-data-api/v1.1
  baseURL: null
  tags:
  - Claims
  - Revenue Cycle
  - Health IT
  properties:
  - type: Documentation
    url: https://hub.tailormed.co/dta/api-documentation
- name: TailorMed HL7 & FHIR Data Exchange
  description: >-
    TailorMed's HL7 and FHIR integration program for keeping patient, prescription and
    program data in sync with the EHR, including an Epic MyChart integration. Its own
    version line, currently v1.5.3, with how-it-works, implementation, data-exchange,
    FHIR app and specifications references. All reference pages are behind the
    Implementation Hub login.
  humanURL: https://hub.tailormed.co/hl7-fhir/v1.5.3
  baseURL: null
  tags:
  - HL7
  - FHIR
  - Interoperability
  - EHR
  properties:
  - type: Conformance
    url: conformance/tailormed-conformance.yml
- name: TailorMed Platform Identity
  description: >-
    OpenID Connect / OAuth 2.0 authorization server for the TailorMed platform, served
    from TailorMed's own domain (an Okta org authorization server on the custom domain
    auth.tailormed.com, issuer https://auth.tailormed.com). This is the only TailorMed
    API surface with a publicly verifiable machine-readable description: RFC 8414
    authorization server metadata and OpenID Provider metadata both return HTTP 200
    unauthenticated.
  humanURL: https://auth.tailormed.com/.well-known/openid-configuration
  baseURL: https://auth.tailormed.com
