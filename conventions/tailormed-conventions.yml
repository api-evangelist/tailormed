reversibility:
  grade: unknown
  state: not-publicly-documented
  write_surfaces:
  - surface: Application Data API
    url: https://hub.tailormed.co/dta/applicationAPI/v1.9.4
    reversal_operation: unknown
    window: null
    note: >-
      TailorMed's own product copy describes writing back to the record of care —
      "Keep patient, prescription, and program data accurate and in sync" and
      "Instantly populate any program form with live EHR data"
      (https://www.tailormed.com/solutions/tailormed-core) — so this is a write
      surface, not a read-only one. Whether an enrolment or application submitted
      through it can be cancelled, withdrawn or reversed, and inside what window, is
      not stated on any public page.
  - surface: Claims Data API
    url: https://hub.tailormed.co/dta/claims-data-api/v1.1
    reversal_operation: unknown
    window: null
  - surface: SFTP data exchange
    url: https://hub.tailormed.co/sftp
    reversal_operation: unknown
    window: null
    note: >-
      File-drop batch exchange. Correction/reversal semantics for a previously
      submitted file are not publicly documented.
  note: >-
    NOT `na`. This is a write-capable platform that enrols patients into financial
    assistance programs; reversibility matters here and the public record is silent.
    No window is asserted because none is published — inventing one could cost a
    patient real money.
