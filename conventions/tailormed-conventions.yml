name: TailorMed API conventions
description: >-
  Cross-cutting runtime semantics for the TailorMed integration surface. TailorMed
  publishes no OpenAPI and its API reference is login-gated, so most dimensions below
  could not be established. Everything marked `unknown` was looked for and not found
  publicly — it is not an assertion that TailorMed lacks it.
gate: >-
  The TailorMed Implementation Hub (hub.tailormed.co, canonical docs.tailormed.co)
  requires an Okta login and is marked "TAILORMED CONFIDENTIAL AND PROPRIETARY". Only
  page titles, the sitemap and the version footer are public.
auth:
  style: OAuth 2.0 / OpenID Connect for platform sign-in; bearer Authorization header on API calls
  issuer: https://auth.tailormed.com
  evidence: >-
    HTTP 401 {"error":"Missing or invalid Authorization header"} from every
    https://hub.tailormed.co/api/* path probed unauthenticated.
  see: authentication/tailormed-authentication.yml
